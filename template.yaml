AWSTemplateFormatVersion: 2010-09-09
Description: >-
  API that returns my current status to visitors of my GitHub profile.
Transform:
- AWS::Serverless-2016-10-31

# Resources declares the AWS resources that you want to include in the stack
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/resources-section-structure.html
Resources:
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: v1
      Domain:
        DomainName: welcome.carrijo.dev.br
        CertificateArn: arn:aws:acm:us-east-1:982081046227:certificate/92e01509-c574-41e8-8326-139b3e8f7025
        EndpointConfiguration: REGIONAL
  
  AppFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/app.handler
      Runtime: nodejs22.x
      Architectures:
      - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Lambda function resposible for processing requests of the Welcoming API.
      Policies:
        # Give Create/Read/Update/Delete Permissions to the SampleTable
      - DynamoDBCrudPolicy:
          TableName: !Ref ProfileTable
      - DynamoDBCrudPolicy:
          TableName: !Ref ThrottleTable
      Environment:
        Variables:
          # Make table name accessible as environment variable from function code during execution
          TABLE_NAME: !Ref ProfileTable
          THROTTLE_TABLE_NAME: !Ref ThrottleTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /
            Method: GET
            RestApiId: !Ref ApiGateway

  ProfileTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ProfileTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  ThrottleTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: WelcomingApiRateLimit
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true